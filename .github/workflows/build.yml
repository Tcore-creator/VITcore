name: Build VITcore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.37"

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.buildozer
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | buildozer android debug
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VITcore-APK
          path: bin/*.apk
          if-no-files-found: error
